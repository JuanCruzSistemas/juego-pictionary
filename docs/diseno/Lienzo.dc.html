<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dibujar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Shantell+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B2A7A}a:hover{color:#0F1A55}
</style>
</helmet>
<main style="width:390px;height:844px;box-sizing:border-box;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;font-family:Figtree,sans-serif;color:#1B2A7A;background-color:#FFFFFF;background-image:linear-gradient(#E6EBF7 1px,transparent 1px),linear-gradient(90deg,#E6EBF7 1px,transparent 1px);background-size:24px 24px">
  <header style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <a href="Elegir.dc.html" aria-label="Volver" style="display:flex;align-items:center;width:44px;height:44px;text-decoration:none">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B2A7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5 8 14l10 9"></path></svg>
    </a>
    <p style="margin:0;font-family:'Shantell Sans',sans-serif;font-weight:800;font-size:22px">Dibujá: <span style="background:#FFE74C;padding:0 6px">Mate</span></p>
    <button type="button" aria-label="Deshacer el último trazo" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:none;border:none;cursor:pointer">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B2A7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6 4 12l6 6"></path><path d="M4 12h13a7 7 0 0 1 0 14h-5"></path></svg>
    </button>
  </header>

  <div style="flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border:2.5px solid #1B2A7A;border-radius:18px">
    <svg width="320" height="320" viewBox="0 0 300 300" fill="none" stroke="#1B2A7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Dibujo de un mate a medio hacer">
      <path stroke="#FFD400" stroke-width="14" d="M112 150c20-6 56-6 78 0M108 170c24-6 62-6 86 0M112 192c20-6 56-6 78 0M122 214c14-5 38-5 58 0"></path>
      <path d="M95 130C85 200 110 248 150 248s65-48 55-118"></path><path d="M92 130c28-15 88-15 116 0"></path><path stroke="#D6293E" d="M165 122 205 55l25-8"></path><path d="M120 95c-10-15 10-25 0-40M92 100c-10-13 8-22 0-34"></path>
    </svg>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between">
    <sc-for list="{{colores}}" as="c" hint-placeholder-count="6">
      <button type="button" onClick="{{c.pick}}" aria-label="{{c.nombre}}" aria-pressed="{{c.sel}}" style="width:44px;height:44px;padding:0;border-radius:50%;cursor:pointer;background:{{c.hex}};border:{{c.borde}};box-shadow:{{c.sombra}}"></button>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <div style="display:flex;align-items:center;gap:4px">
      <button type="button" onClick="{{gFino}}" aria-label="Trazo fino" aria-pressed="{{esFino}}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:2px solid #1B2A7A;border-radius:12px;cursor:pointer;background:{{fondoFino}}"><span style="display:block;width:6px;height:6px;border-radius:50%;background:#1B2A7A"></span></button>
      <button type="button" onClick="{{gMedio}}" aria-label="Trazo medio" aria-pressed="{{esMedio}}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:2px solid #1B2A7A;border-radius:12px;cursor:pointer;background:{{fondoMedio}}"><span style="display:block;width:12px;height:12px;border-radius:50%;background:#1B2A7A"></span></button>
      <button type="button" onClick="{{gGrueso}}" aria-label="Trazo grueso" aria-pressed="{{esGrueso}}" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:2px solid #1B2A7A;border-radius:12px;cursor:pointer;background:{{fondoGrueso}}"><span style="display:block;width:20px;height:20px;border-radius:50%;background:#1B2A7A"></span></button>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <button type="button" aria-label="Goma de borrar" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:#FFFFFF;border:2px solid #1B2A7A;border-radius:12px;cursor:pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1B2A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 4 6 6-9 9H7l-3-3a2 2 0 0 1 0-3l10-9Z"></path><path d="M9 8l6 6"></path></svg>
      </button>
      <button type="button" aria-label="Borrar todo el dibujo" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;background:#FFFFFF;border:2px solid #1B2A7A;border-radius:12px;cursor:pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D6293E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
      </button>
    </div>
  </div>

  <a href="Seguimiento.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;box-sizing:border-box;padding:12px 20px;background:#FFE74C;color:#1B2A7A;border:2.5px solid #1B2A7A;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:3px 3px 0 #1B2A7A;font-family:'Shantell Sans',sans-serif;font-weight:700;font-size:18px;text-decoration:none">Mandar dibujo</a>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { color: '#1B2A7A', grosor: 'medio' };
  renderVals() {
    const lista = [
      ['#1B2A7A', 'Azul birome'], ['#111111', 'Negro'], ['#D6293E', 'Rojo'],
      ['#FFD400', 'Amarillo'], ['#1E9E5A', 'Verde'], ['#8A4B2A', 'Marrón']
    ];
    const colores = lista.map(([hex, nombre]) => {
      const sel = this.state.color === hex;
      return {
        nombre, sel, hex,
        borde: sel ? '4px solid #FFFFFF' : '2px solid #1B2A7A',
        sombra: sel ? '0 0 0 3px #1B2A7A' : 'none',
        pick: () => this.setState({ color: hex })
      };
    });
    const g = this.state.grosor;
    const fondo = (on) => (on ? '#FFE74C' : '#FFFFFF');
    return {
      colores,
      esFino: g === 'fino', esMedio: g === 'medio', esGrueso: g === 'grueso',
      fondoFino: fondo(g === 'fino'), fondoMedio: fondo(g === 'medio'), fondoGrueso: fondo(g === 'grueso'),
      gFino: () => this.setState({ grosor: 'fino' }),
      gMedio: () => this.setState({ grosor: 'medio' }),
      gGrueso: () => this.setState({ grosor: 'grueso' })
    };
  }
}
</script>
</body>
</html>
