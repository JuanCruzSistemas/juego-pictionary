<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir palabra</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Shantell+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1B2A7A}a:hover{color:#0F1A55}
</style>
</helmet>
<main style="width:390px;height:844px;box-sizing:border-box;padding:24px 20px;display:flex;flex-direction:column;gap:20px;overflow:hidden;font-family:Figtree,sans-serif;color:#1B2A7A;background-color:#FFFFFF;background-image:linear-gradient(#E6EBF7 1px,transparent 1px),linear-gradient(90deg,#E6EBF7 1px,transparent 1px);background-size:24px 24px">
  <a href="Main.dc.html" aria-label="Volver al inicio" style="display:flex;align-items:center;width:44px;height:44px;text-decoration:none">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#1B2A7A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 5 8 14l10 9"></path></svg>
  </a>
  <h1 style="margin:0;font-family:'Shantell Sans',sans-serif;font-weight:800;font-size:32px;line-height:1.15">¿Qué vas a dibujar?</h1>

  <div style="display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{opciones}}" as="op" hint-placeholder-count="3">
      <button type="button" onClick="{{op.pick}}" aria-pressed="{{op.sel}}" style="min-height:56px;box-sizing:border-box;padding:12px 16px;color:#1B2A7A;border:2px solid #1B2A7A;border-radius:12px;font-family:'Shantell Sans',sans-serif;font-weight:700;font-size:20px;text-align:left;cursor:pointer;background:{{op.fondo}};box-shadow:{{op.sombra}}">{{op.texto}}</button>
    </sc-for>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="propia" style="font-size:15px;font-weight:700">O escribí la tuya</label>
    <input id="propia" type="text" placeholder="Una palabra que solo ustedes entiendan" style="min-height:52px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;color:#1B2A7A;border:2px solid #1B2A7A;border-radius:12px;font-family:Figtree,sans-serif;font-size:16px">
    <a href="Palabras.dc.html" style="display:flex;align-items:center;min-height:44px;font-size:15px;font-weight:600">Ver nuestras palabras</a>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;margin-top:auto">
    <a href="Lienzo.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;box-sizing:border-box;padding:12px 20px;background:#FFE74C;color:#1B2A7A;border:2.5px solid #1B2A7A;border-radius:255px 18px 225px 18px/18px 225px 18px 255px;box-shadow:3px 3px 0 #1B2A7A;font-family:'Shantell Sans',sans-serif;font-weight:700;font-size:18px;text-decoration:none">Empezar a dibujar</a>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;box-sizing:border-box;padding:10px 12px;background:#FFFFFF;border:2px dashed #1B2A7A;border-radius:12px">
      <span style="display:flex;flex-direction:column;gap:2px">
        <strong style="font-size:15px;font-weight:700">Te quedan 2 de 3</strong>
        <span style="font-size:13px;color:#46528A">Se renuevan cada media hora</span>
      </span>
      <a href="Main.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;box-sizing:border-box;padding:0 14px;background:#FFFFFF;border:2px solid #1B2A7A;border-radius:12px;font-size:15px;font-weight:700;text-decoration:none">Saltear turno</a>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { elegida: 'Mate' };
  renderVals() {
    const opciones = ['Mate', 'Bicicleta', 'Paraguas'].map((texto) => {
      const sel = this.state.elegida === texto;
      return {
        texto,
        sel,
        fondo: sel ? '#FFE74C' : '#FFFFFF',
        sombra: sel ? '3px 3px 0 #1B2A7A' : 'none',
        pick: () => this.setState({ elegida: texto })
      };
    });
    return { opciones };
  }
}
</script>
</body>
</html>
